name: mc-storage-manager

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      DATABASE_URL: /app/data/storage.db
      COOKIE_SECURE: "true"
      TRUST_PROXY_HEADERS: "true"
    expose:
      - "3000"
    volumes:
      - web_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflared_token
    depends_on:
      web:
        condition: service_healthy
    secrets:
      - cloudflared_token

secrets:
  cloudflared_token:
    file: ./secrets/cloudflared-token.txt

volumes:
  web_data:
